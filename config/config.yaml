# Configuration for workflow/Snakefile. Every number that affects a result lives here.

grammar_compare:
  k: 5            # folds, split by BioModels model
  seeds: [0, 1, 2]  # fold seeds (results reported per seed and averaged)

# R library holding nlraa, drc (rule curvelib_eval) and linpk, frair, FSA, deSolve (rule biocat_eval) ("" = default library)
r_lib: "~/Library/R_hsr"

# BioModels curated id range (rule biomodels_corpus); the highest curated id was BIOMD0000001103 on 2026-11-24
biomodels_first: 1
biomodels_last: 1103

# nlmixr2lib model library (rule nlmixr2lib_fetch; CRAN source tarball)
nlmixr2lib_version: "0.3.2"

# allodb (ropensci/allodb) commit for rule allodb_fetch (master on 2026-11-24, last pushed 2025-03-06)
allodb_commit: "1cfe846eb4fd32e7561dcc2dd7a932354b2b3b33"

# CRAN source tarballs whose R files are sourced by rule rcurves_eval (internal model equations)
cran_sources:
  bayesnec: "2.1.3.1"

# hierarchical Pitman-Yor sampler (rule hpy_scores)
hpy_sweeps: 20
hpy_keep: 10

# tree-prior variants (rules hpyv_*; hsr.pyp, hsr.adaptor). Keys other than
# model/mode are hsr.pyp.ContextSpec arguments: n ancestors in a first
# child's context (a second child has n-1 and its left sibling l); drop_L /
# drop_R the back-off order (first dropped first; default: source s, depth d,
# most distant ancestor first, the sibling last, as fnprior); graph the
# components dropped along parallel back-off paths with learned mixing
# weights; depth_cap the capped node depth as a component; source the corpus
# source as a component. model adaptor: a Pitman-Yor adaptor over whole
# subtrees at the root only (mode root: forms) or at every node (mode all).
hpyv:
  sweeps: 20
  keep: 10
  calib_samples: 4000
  # variants run by the workflow (all of `variants` if empty); the full set of
  # 17 was compared on the five original corpora (results/grammar/hpy_variants.md)
  run: [sym0, hpy2, hpy3_depth, hpy2_src, form_ad, form_ad3_depth, tree_ad3]
  variants:
    sym0: {n: 0, drop_L: [], drop_R: []}
    hpy2: {n: 2}
    hpy2_parent: {n: 2, drop_R: [l, a1]}
    hpy2_graph: {n: 2, graph: [a2, a1, l]}
    hpy3: {n: 3}
    hpy3_graph: {n: 3, graph: [a3, a2, a1, l]}
    hpy2_depth: {n: 2, depth_cap: 6}
    hpy2_src: {n: 2, source: true}
    hpy2_dhpy: {n: 2, source: true, graph: [s]}
    form_ad: {model: adaptor, mode: root, n: 2}
    tree_ad: {model: adaptor, mode: all, n: 2}
    hpy3_depth: {n: 3, depth_cap: 6}
    form_ad3: {model: adaptor, mode: root, n: 3}
    tree_ad3: {model: adaptor, mode: all, n: 3}
    tree_ad_depth: {model: adaptor, mode: all, n: 2, depth_cap: 6}
    form_ad3_depth: {model: adaptor, mode: root, n: 3, depth_cap: 6}
    tree_ad3_depth: {model: adaptor, mode: all, n: 3, depth_cap: 6}

# Hold-out sources (hsr.grammar_compare.HOLDOUT_SOURCES): scored by the
# `holdout` target after training every prior on all sources of
# hsr.grammar_compare.SOURCES; never used to train any prior.
holdout_sources: [rnls, ratelaws, ecocat2]

# temporal hold-out (rules temporal_*; hsr.temporal, hsr.model_dates): priors
# trained on models dated before each cutoff year, scored on the forms of
# models dated from that year on
temporal:
  cutoffs: [2010, 2015, 2020]
  weightings: [equal, pooled]

# mechanism-derived forms (rules mechanism_forms, mechholdout_*, mechanisms;
# hsr.mechanisms): n random mechanisms per class, one seed for all classes;
# forms with more than max_consts constants (temperature: more than max_terms
# exponential terms) are dropped and counted
mechanisms:
  seed: 0
  max_consts: 8
  max_terms: 6
  n:
    enzyme: 1000
    compartment: 1000
    temperature: 1000

# look-alike discrimination test (rules lookalike_*; hsr.lookalike): true
# forms per stratum, (n, noise) settings, replicates, candidate-set size
# limits, look-alike thresholds D (nats) and evidence shards (GitHub Actions,
# .github/workflows/lookalike.yml: jobs x shards/jobs shards)
lookalike:
  seed: 1
  temporal_cutoff: 2015
  max_consts: 5
  max_nodes: 15
  strata:
    holdout_seen: 10
    holdout_novel: 10
    mech_enzyme: 8
    mech_compartment: 8
    mech_temperature: 8
    temporal_novel: 12
  settings: [[10, 0.02], [10, 0.1], [40, 0.02], [40, 0.1]]
  reps: 3
  deltas: [2, 5, 10]   # report only (the design is not rebuilt for these)
  n_starts: 10
  shards: 80
  jobs: 20             # Actions matrix jobs (each runs shards/jobs shard targets on 4 cores)
  weightings: [equal, pooled]   # report only: priors of runs mechholdout_<w> and temporal_<cutoff>_<w>

# second look-alike design (rules lookalike_c7_*): the lookalike settings with
# these overrides. A larger cap on constants and nodes, so that most
# mechanism-derived forms (up to 7 constants, 25 nodes) qualify as true forms
# and candidates; every eligible mechanism form is used. Evidence on Actions
# (.github/workflows/lookalike.yml with [design=c7] in the trigger line).
lookalike_c7:
  max_consts: 7
  max_nodes: 25
  strata:
    holdout_seen: 10
    holdout_novel: 10
    mech_enzyme: 15
    mech_compartment: 20
    mech_temperature: 6
    temporal_novel: 12
  shards: 80
  jobs: 20

# prior tempering in the look-alike test (rule lookalike_tempering): P^tau / Z
# over the candidate set for each reported tau; tau chosen by
# leave-one-truth-form-out on a grid 0, step, ..., max (must contain 0 and 1).
lookalike_tempering:
  taus: [0, 0.25, 0.5, 0.75, 1, 1.5]
  tau_grid: {max: 2.0, step: 0.05}
  priors_md: [hpy3_depth, fnprior_kn, tree_ad3, form_ad3_depth, hpy2_src, sym0, cf, position_backoff20]

# blended priors (rule blend_report; hsr.blend): mixtures of tree priors, weights
# chosen on the LOSO runs only, evaluated on the hold-out and temporal tests.
# pairs: P_w = w P_A + (1 - w) P_B (grid search over w); triples: EM weights.
# The mixture of every tree prior is always added.
blend:
  pairs: [[tree_ad3, hpy3_depth], [tree_ad3, hpy2], [tree_ad3, fnprior_kn], [form_ad3_depth, hpy3_depth],
          [form_ad3_depth, hpy2], [form_ad3_depth, fnprior_kn], [tree_ad3, sym0]]
  triples: [[tree_ad3, hpy3_depth, fnprior_kn], [tree_ad3, form_ad3_depth, hpy3_depth]]

# paper-1 tables and figures (rules paper1_data, paper1; workflow/scripts/paper1_*.py;
# outputs in results/paper1, file-by-file guide in results/paper1/README.md).
# main_priors: rows of the compact main-text tables and panels of the main figures;
# main_weighting: source weighting of the compact tables and main figures; main_blend:
# the blend shown in the compact tables; main_cutoff: temporal cutoff of the main size
# figure; delta: look-alike threshold D (nats) of the compact look-alike table.
# sources: display label, licence and extraction route of each corpus source,
# summarised from hsr/data/sources/README.md (text only: every number in the corpus
# table is computed from the corpus files).
paper1:
  main_priors: [sym0, fnprior_kn, hpy3_depth, form_ad3_depth, tree_ad3]
  main_weighting: equal
  main_blend: "tree_ad3 + hpy3_depth"
  main_cutoff: 2015
  delta: 5
  sources:
    biomodels: {label: "BioModels (curated)", licence: "CC0", route: "SBML kinetic laws"}
    biomodels_nc: {label: "BioModels (non-curated)", licence: "CC0", route: "SBML kinetic laws"}
    jws: {label: "JWS Online", licence: "none stated", route: "SBML kinetic laws"}
    sabiork: {label: "SABIO-RK", licence: "non-commercial", route: "rate equations (JSON export)"}
    cellml: {label: "CellML (PMR)", licence: "per workspace", route: "libCellML code generation"}
    modeldb: {label: "ModelDB", licence: "citation required", route: "NMODL parser"}
    nlmixr2lib: {label: "nlmixr2lib", licence: "GPL", route: "R parser of model blocks"}
    allodb: {label: "allodb", licence: "GPL-3", route: "R expressions, checked in R"}
    curvelib: {label: "R curve libraries", licence: "GPL (formulas)", route: "transcribed, verified in R"}
    thermal: {label: "Thermal performance", licence: "GPL/MIT (formulas)", route: "transcribed, verified in R"}
    ecocurves: {label: "Ecological curves", licence: "GPL/MIT (formulas)", route: "transcribed, verified in R"}
    biocat: {label: "Curated catalogue", licence: "textbook forms", route: "transcribed, checked in R"}
    rnls: {label: "CRAN nls code", licence: "GPL/MIT per package", route: "R parser of nls() calls"}
    ratelaws: {label: "SBO and COPASI rate laws", licence: "Artistic 2.0", route: "MathML / COPASI functions"}
    ecocat2: {label: "Ecology catalogue 2", licence: "GPL/MIT (formulas)", route: "transcribed, verified in R"}
