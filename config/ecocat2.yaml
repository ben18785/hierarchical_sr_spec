# Hold-out source ecocat2 (workflow/rules/ecocat2.smk): CRAN source tarballs
# whose R files are read (top-level function definitions only) by rule
# ecocat2_eval; these packages are not on conda-forge and are never installed.
# Versions current on CRAN on 2026-11-25 (phytotools: last archived release).
ecocat2:
  cran:
    MortalityLaws: "3.0.0"
    phytotools: "1.0"
    photosynthesisLRC: "1.0.6"
    REddyProc: "1.3.4"
    plantecophys: "1.4-6"
    chillR: "0.77"
  # R files (inside each tarball) whose function definitions are evaluated
  sourced:
    MortalityLaws: [MortalityLaws/R/MortalityLaw_models.R]
    phytotools: [phytotools/R/fitJP.R, phytotools/R/fitEP.R, phytotools/R/fitPGH.R, phytotools/R/fitWebb.R]
    photosynthesisLRC: [photosynthesisLRC/R/eq1.R, photosynthesisLRC/R/eq2.R, photosynthesisLRC/R/eq3.R,
                        photosynthesisLRC/R/eq4.R, photosynthesisLRC/R/eq5.R, photosynthesisLRC/R/eq6.R,
                        photosynthesisLRC/R/eq8.R, photosynthesisLRC/R/eq9.R, photosynthesisLRC/R/eq11.R]
    REddyProc: [REddyProc/R/GeoFunctions.R, REddyProc/R/LRC_rectangular.R, REddyProc/R/LRC_nonrectangular.R,
                REddyProc/R/LRC_logisticSigmoid.R]
    plantecophys: [plantecophys/R/fitBB.R, plantecophys/R/photosyn.R]
    chillR: [chillR/R/temp_models.R]
  # installed packages of the pinned R environment (envs/r.yaml)
  installed: [vegan, sads]
