# Manually triggered: gh workflow run benchmark.yml -f grid=main
# Synthetic benchmark (spec section 6). Run from the Actions tab
# ("Run workflow"). Each matrix job runs `reps` replicate populations of one
# (variant, setting, n_j, noise) cell; the final job merges everything into
# results/summary (tables + plots), uploaded as the `benchmark-summary` artifact.
name: benchmark
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "replicates per cell (python range a:b)"
        default: "0:20"
      sweeps:
        description: "Gibbs sweeps per chain"
        default: "2000"
      burn:
        description: "burn-in sweeps"
        default: "500"
      grid:
        description: "main | sensitivity | all | families | families_full | families_corpus | families_si | constraints | realdata | realdata_si | pysr"
        default: "all"
      only:
        description: "optional regex: run only matrix jobs whose name matches"
        default: ""
      task:
        description: "benchmark | corpus (build hsr/data/corpus.json from BioModels BIOMD first..last)"
        default: "benchmark"
      first:
        description: "corpus: first BIOMD number"
        default: "1"
      last:
        description: "corpus: last BIOMD number"
        default: "1100"

jobs:
  plan:
    if: inputs.task != 'corpus'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          GRID: ${{ inputs.grid }}
          ONLY: ${{ inputs.only }}
        run: echo "matrix=$(python3 benchmarks/matrix.py --grid "$GRID" --only "$ONLY")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[plots]"
      - if: matrix.module == 'pysr'
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            ~/.cache/pip
          key: pysr-julia-v1
      - if: matrix.module == 'pysr'
        run: pip install -e ".[pysr]" && python -c "import pysr"
      - name: run cell
        run: |
          mkdir -p results/raw
          if [ "${{ matrix.module }}" = "pysr" ]; then
            python benchmarks/pysr_baseline.py ${{ matrix.args }} --reps '${{ inputs.reps }}' \
              --out results/raw/${{ matrix.name }}.jsonl
            exit 0
          fi
          if [ "${{ matrix.module }}" = "realdata" ]; then
            python -m hsr.realdata ${{ matrix.args }} --sweeps ${{ inputs.sweeps }} --burn ${{ inputs.burn }} \
              --out results/raw/${{ matrix.name }}.jsonl
            exit 0
          fi
          python -m hsr.experiment --setting ${{ matrix.setting }} --n ${{ matrix.n }} \
            --noise ${{ matrix.noise }} --reps '${{ inputs.reps }}' \
            --sweeps ${{ inputs.sweeps }} --burn ${{ inputs.burn }} \
            ${{ matrix.extra }} --out results/raw/${{ matrix.name }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.name }}
          path: results/raw/${{ matrix.name }}.jsonl

  summarise:
    needs: run
    if: always() && inputs.task != 'corpus' && !startsWith(inputs.grid, 'realdata') && inputs.grid != 'pysr' && inputs.grid != 'constraints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[plots]"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: results/raw
          merge-multiple: true
      - run: python benchmarks/summarise.py 'results/raw/*.jsonl' --out results/summary
      - run: cat results/summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            results/summary
            results/raw

  corpus:
    if: inputs.task == 'corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[corpus]"
      - run: python -m hsr.corpus build --out corpus.json --first ${{ inputs.first }} --last ${{ inputs.last }} --cache corpus_cache
      - run: python -m hsr.corpus summary corpus.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus.json
