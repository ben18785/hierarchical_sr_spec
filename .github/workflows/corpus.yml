# Manually triggered: gh workflow run corpus.yml -f first=1 -f last=1100
# Downloads the manually curated BioModels, reduces every kinetic law to
# one-variable canonical skeletons (hsr/corpus.py) and uploads corpus.json.
name: corpus
on:
  workflow_dispatch:
    inputs:
      first:
        description: "first BIOMD number"
        default: "1"
      last:
        description: "last BIOMD number"
        default: "1100"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[corpus]"
      - run: python -m hsr.corpus build --out corpus.json --first ${{ inputs.first }} --last ${{ inputs.last }} --cache corpus_cache
      - run: python -m hsr.corpus summary corpus.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus.json
