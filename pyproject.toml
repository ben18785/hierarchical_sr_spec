[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsr"
version = "0.1.0"
description = "Hierarchical symbolic regression: partial pooling of equation structure across datasets (prototype)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=7", "pyyaml>=6"]
plots = ["matplotlib>=3.7"]
corpus = ["python-libsbml>=5.20"]
pysr = ["pysr>=1.0"]
fnprior = ["fnprior==0.5.0"]
workflow = ["snakemake==9.27.2"]

[tool.setuptools]
packages = ["hsr"]

[tool.setuptools.package-data]
hsr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: validation tests that take more than a few seconds"]
